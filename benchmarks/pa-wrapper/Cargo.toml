[package]
name = "pa-wrapper-runner"
version = "0.1.0"
edition = "2021"
publish = false

# `run.py` clones pa-bench here at a pinned commit; its `pa-wrapper` crate builds every aligner A*PA2's
# evaluation compared against, with the parameters it used. Nothing of it is vendored.
[dependencies]
libc = "0.2"
pa-types = { git = "https://github.com/pairwise-alignment/pa-types" }
rust-wfa2 = { git = "https://github.com/pairwise-alignment/rust-wfa2" }

# KSW2's kernels are SSE only, so it is built on x86-64 alone.
[target.'cfg(target_arch = "x86_64")'.dependencies]
pa-wrapper = { path = "../.cache/pa-bench/pa-wrapper", default-features = false, features = ["edlib", "wfa", "block_aligner", "ksw2"] }

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
pa-wrapper = { path = "../.cache/pa-bench/pa-wrapper", default-features = false, features = ["edlib", "wfa", "block_aligner"] }

[profile.release]
opt-level = 3
lto = "thin"
